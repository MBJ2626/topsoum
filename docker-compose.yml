services:
  postgres:
    image: postgres:16-alpine
    container_name: topsoum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topsoum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topsoum_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-topsoum}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - topsoum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topsoum}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: topsoum-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - topsoum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  topsoum_postgres_data:
  topsoum_redis_data:
