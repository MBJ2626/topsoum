<!doctype html>
<!--
  Page de secours servie par sw.js quand une page n'a jamais ete visitee
  (absente du cache) et que le reseau est coupe. HTML statique sans JS :
  les chunks JS d'une page Next ont des noms hashes par build, impossibles
  a pre-cacher, et une page Next sans ses chunks plante (ChunkLoadError).
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef0f3" />
    <meta name="robots" content="noindex" />
    <title>Hors ligne — TopSoum</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #eef0f3;
        color: #15171c;
      }
      main {
        box-sizing: border-box;
        max-width: 36rem;
        min-height: 60vh;
        margin: 16px auto;
        padding: 32px 20px;
        background: #ffffff;
        border: 1px solid #e2e5e9;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #5f646d;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid #cdd1d7;
        border-radius: 12px;
        color: #15171c;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connexion perdue</h1>
      <p>Cette page n'est pas disponible hors ligne. Les produits déjà consultés restent accessibles.</p>
      <a href="/">Retour à l'accueil</a>
    </main>
  </body>
</html>
